{% extends "base.html" %}
{% block content %}
<h2>Create Training Program</h2>

<div class="card">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    
    <label>Program Name</label>
    <input name="name" required placeholder="My Program" value="My Program">
    
    <label>Split Type</label>
    <select name="split" required>
      <option value="PPL">Push/Pull/Legs (6 days)</option>
      <option value="UL">Upper/Lower (4 days)</option>
      <option value="FB">Full Body (3-6 days)</option>
    </select>
    
    <label>Days Per Week</label>
    <input name="days_per_week" type="number" min="3" max="6" value="4" required>
    
    <label>Program Duration (weeks)</label>
    <input name="duration_weeks" type="number" min="4" max="16" value="8" required>
    
    <label>Target RIR</label>
    <select name="target_rir" required>
      <option value="1">1 RIR (very hard)</option>
      <option value="2" selected>2 RIR (hard)</option>
      <option value="3">3 RIR (moderate)</option>
    </select>
    
    <div style="margin-top: 20px; display: flex; gap: 10px;">
      <button type="submit" class="btn-primary">Create Program</button>
      <a href="{{ url_for('current_program') }}" class="btn">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
